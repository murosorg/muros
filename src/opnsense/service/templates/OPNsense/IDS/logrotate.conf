{#
    MurOS: FreeBSD rotated these two files with newsyslog, which took a rotation
    keyword of its own, a pid file and a signal number. Debian rotates with
    logrotate, and suricata reopens its files on USR2, so the postrotate hook
    sends that instead of the HUP newsyslog sent. The model keeps the newsyslog
    keywords, they are translated here.
#}
{% if not helpers.empty('OPNsense.IDS.general.enabled') %}
/var/log/suricata/stats.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root root
    sharedscripts
    postrotate
        /usr/bin/pkill -USR2 -x suricata > /dev/null 2>&1 || true
    endscript
}

/var/log/suricata/eve.json {
    {% if OPNsense.IDS.general.AlertLogrotate|default('W0D23') == 'D0' %}daily{% else %}weekly{% endif %}

    rotate {{ OPNsense.IDS.general.AlertSaveLogs|default(4) }}
    size 500k
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root root
    sharedscripts
    postrotate
        /usr/bin/pkill -USR2 -x suricata > /dev/null 2>&1 || true
    endscript
}
{% endif %}
