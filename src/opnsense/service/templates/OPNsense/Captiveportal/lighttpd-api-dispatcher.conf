#
# lighttpd configuration file for captiveportal API access (used by proxy pass on every zone, only accessible via localhost)
#
############ Options you really have to take care of ####################

## modules to load
server.modules              = ( "mod_access", "mod_expire", "mod_deflate", "mod_redirect",
				"mod_fastcgi","mod_alias", "mod_rewrite"
)

# MurOS: the web user is www-data, there is no separate wwwonly account, and
# mod_cgi is not used by the dispatcher
server.username = "www-data"
server.groupname = "www-data"
server.max-keep-alive-requests = 15
server.max-keep-alive-idle = 30

## a static document-root, for virtual-hosting take look at the
## server.virtual-* options
server.document-root        = "/usr/local/opnsense/www/"


# Phalcon api routing
alias.url += ( "/api/"  => "/usr/local/opnsense/www/" )
url.rewrite-if-not-file = ("^/api/([^\?]+)(\?(.*))?" => "/api/api.php?$3")


# Maximum idle time with nothing being written (php downloading)
server.max-write-idle = 999

## where to send error-messages to
server.errorlog-use-syslog="enable"

# files to check for if .../ is requested
index-file.names            = ( "index.php", "index.html",
                                "index.htm", "default.htm" )

url.access-deny             = ( "~", ".inc" )


######### Options that are good to be but not necessary to be changed #######

## bind to port (default: 80)
server.bind               = "127.0.0.1"
server.port               = 8999

## to help the rc.scripts
server.pid-file            = "/var/run/lighttpd-api-dispatcher.pid"

## enable debugging
debug.log-request-header   = "disable"
debug.log-response-header  = "disable"
debug.log-request-handling = "disable"
debug.log-file-not-found   = "disable"
server.max-request-size    = 2097152

#### fastcgi module
# MurOS: the dispatcher hands PHP to the php-fpm pool of the package, like the
# web interface does. Debian ships no php-cgi, so the children it used to spawn
# could never start and every captive portal API call would have failed.
fastcgi.server = ( ".php" =>
	( "localhost" =>
		(
			"socket" => "/run/php/php8.4-fpm.sock",
			"broken-scriptfilename" => "enable"
		)
	)
)
