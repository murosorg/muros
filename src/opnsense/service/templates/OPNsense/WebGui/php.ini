; File generated via configd
;
; MurOS: FreeBSD kept a single php.ini per prefix, so this template used to be
; the whole PHP configuration, written to /usr/local/etc/php.ini and
; /usr/local/lib/php.ini. Debian has one directory of drop-ins per SAPI and the
; package already ships the appliance settings there as 99-muros.ini, so this
; file only carries what depends on the configuration and is loaded after it,
; for the pool serving the interface and for the command line SAPI running the
; configd actions.
zlib.output_compression = {% if system.webgui.compression|default('') != "" %}On{%else%}Off{%endif%}

zlib.output_compression_level = {{system.webgui.compression|default('1')}}
date.timezone = "{{system.timezone|default('Etc/UTC')}}"
session.gc_maxlifetime = {{system.webgui.session_timeout|default(240)|int * 60}}
{% if system.deployment|default("") == "" %}
error_reporting = E_ALL ^ (E_WARNING | E_NOTICE | E_DEPRECATED | E_CORE_WARNING | E_COMPILE_WARNING)
{% else %}
error_reporting = E_ALL
{% endif %}
