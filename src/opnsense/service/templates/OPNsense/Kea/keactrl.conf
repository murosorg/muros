#!/bin/sh

{#
    MurOS: FreeBSD ran the daemons through keactrl, which needed the location of
    every configuration file and every binary. Debian ships one unit per daemon,
    reading its configuration from /etc/kea, and kea_service.sh maps the flags
    below to those units, so the paths are gone: what is left is which daemons
    the configuration asks for.
#}

# Start DHCPv4 server?
dhcp4={% if not helpers.empty('OPNsense.Kea.dhcp4.general.enabled') %}yes{% else %}no{% endif %}

# Start DHCPv6 server?
dhcp6={% if not helpers.empty('OPNsense.Kea.dhcp6.general.enabled') %}yes{% else %}no{% endif %}

# Start DHCP DDNS server?
dhcp_ddns={% if not helpers.empty('OPNsense.Kea.ddns.general.enabled') %}yes{% else %}no{% endif %}

# Start Control Agent?
ctrl_agent={% if not helpers.empty('OPNsense.Kea.ctrl_agent.general.enabled') %}yes{% else %}no{% endif %}
