{#
    MurOS: FreeBSD read the kernel from /dev/klog and the userland from the
    /var/run/log and /var/run/logpriv datagram sockets. On Debian systemd owns
    /dev/log and the kernel ring buffer, so the messages are taken from the
    journal, which the system() source of syslog-ng reads directly on a systemd
    host. Nothing is lost, the kernel included, and the program name still comes
    through as the syslog identifier, which is what the local filters match on.
#}
    internal();
    system();
