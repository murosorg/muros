###################################################################
# Local syslog-ng configuration filter definition [filter].
###################################################################
{#
    MurOS: the firewall log is produced by the nftables log statements of the
    generated ruleset, which the kernel emits with a "muros,<action>,<uuid>"
    prefix. There is no filterlog daemon to attribute the messages to anymore,
    so the filter picks the kernel messages carrying that marker: the log file
    and any remote destination of the filter facility get the firewall events
    again, and only those.
#}
filter f_local_filter {
    program("kernel") and message("muros,");
};
